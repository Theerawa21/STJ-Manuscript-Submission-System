<!doctype html><html><head><meta charset="utf-8"></head><body><script>
(function(){
  'use strict';
  var channel = '<?= channel ?>';
  var origin = 'https://theerawa21.github.io';
  var allowed = ['getPublicConfig','authorLogin','registerAuthor','authorLogout','getMyManuscripts','submitManuscriptFromWeb','trackManuscript','editorLogin','editorLogout','getDashboard','getSubmissionDetail','updateSubmissionStatus'];
  function reply(id,result){window.top.postMessage({protocol:'stj-bridge-v1',kind:'response',channel:channel,id:id,result:result},origin);}
  window.addEventListener('message',function(event){
    var m=event.data;
    if(event.origin!==origin||event.source!==window.top||!channel||!m||m.protocol!=='stj-bridge-v1'||m.channel!==channel||m.kind!=='request'||typeof m.id!=='string'||allowed.indexOf(m.method)<0)return;
    google.script.run.withSuccessHandler(function(result){reply(m.id,result);}).withFailureHandler(function(){reply(m.id,{ok:false,error:'เชื่อมต่อฐานข้อมูลไม่สำเร็จ กรุณาลองอีกครั้ง'});})[m.method](m.payload);
  });
  if(channel)window.top.postMessage({protocol:'stj-bridge-v1',kind:'ready',channel:channel},origin);
})();
</script></body></html>
