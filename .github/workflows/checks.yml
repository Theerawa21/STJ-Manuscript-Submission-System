name: Journal system checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/core.test.js
      - run: node tests/integration.test.js
      - run: node tests/github-transport.test.js
      - run: node tests/journal-lifecycle.test.js
